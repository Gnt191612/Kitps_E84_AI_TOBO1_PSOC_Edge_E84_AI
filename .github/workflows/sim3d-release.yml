# 推送 sim3d-v* 标签时，自动打包 3D 仿真并发布到 GitHub Releases
name: Sim3D Release

on:
  push:
    tags:
      - 'sim3d-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Kitps_E84_AI_TOBO1_PSOC_Edge_E84_AI/code/tools
            Kitps_E84_AI_TOBO1_PSOC_Edge_E84_AI/code/WIRING.md
          sparse-checkout-cone-mode: false

      - name: Check wiring table
        shell: pwsh
        run: python Kitps_E84_AI_TOBO1_PSOC_Edge_E84_AI/code/tools/check_sim_wiring.py

      - name: Build package
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Kitps_E84_AI_TOBO1_PSOC_Edge_E84_AI/code/tools/package_sim3d.ps1 -Version "${{ github.ref_name }}"

      - name: Test installer
        shell: powershell
        run: |
          function Run-Installer($extra) {
            $psi = New-Object Diagnostics.ProcessStartInfo
            $psi.FileName = (Resolve-Path 'dist\Sim3D-Windows.exe').Path
            $psi.UseShellExecute = $false
            foreach ($k in $extra.Keys) { $psi.EnvironmentVariables[$k] = $extra[$k] }
            $p = [Diagnostics.Process]::Start($psi)
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'installer timed out' }
            if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          }
          $dest = Join-Path $env:RUNNER_TEMP 'sim3d_test'
          Run-Installer @{ SIM3D_DEST = $dest; SIM3D_QUIET = '1' }
          if (-not (Test-Path "$dest\sim_3d.html")) { throw 'installer did not extract the app' }
          if (-not (Test-Path "$dest\vendor\three.min.js")) { throw 'engine missing from package' }
          $links = Join-Path $env:RUNNER_TEMP 'sim3d_links'
          Run-Installer @{ SIM3D_DEST = $dest; SIM3D_LNK_DIR = $links }
          if (@(Get-ChildItem -Recurse -Filter *.lnk $links).Count -ne 3) { throw 'expected 3 shortcuts' }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Sim3D-Windows.exe dist/Sim3D-Portable.zip --title "3D 仿真 ${{ github.ref_name }}" --notes-file Kitps_E84_AI_TOBO1_PSOC_Edge_E84_AI/code/tools/package/release_notes.md
