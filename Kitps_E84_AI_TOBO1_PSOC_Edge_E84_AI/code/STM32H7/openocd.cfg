# OpenOCD 配置 — STM32H743ZIT6 via ST-Link (板载调试器)
#
# 注意：本板使用 ST-Link（Nucleo 板载），不是 J-Link。
# 烧录推荐使用 STM32CubeProgrammer CLI，见 tasks.json 中的 "Flash" 任务。
# 如需 OpenOCD 调试，需要安装 OpenOCD 并确保 stlink.cfg 在搜索路径中。

source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32h7x.cfg]

adapter speed 4000
reset_config srst_only srst_nogate
