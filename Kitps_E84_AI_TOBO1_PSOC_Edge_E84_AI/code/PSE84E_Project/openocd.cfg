# 1. 先定义 _TARGETNAME 变量（必须放在最前面）
if {![info exists _TARGETNAME]} {
    set _TARGETNAME $_TARGETNAME
}

# 2. 加载调试器接口（J-Link）
source [find interface/jlink.cfg]
transport select swd

# 3. 基础通信设置
adapter speed 4000
reset_config srst_only

# 4. 创建目标芯片（XMC8400E = Cortex-M55）
target create $_TARGETNAME cortex_m

# XMC8400E 是 Cortex-M55，OpenOCD cortex_m target 兼容所有 Cortex-M 变体
# 如需 M55 特有功能（MVE/Helium），需确保 OpenOCD 版本 >= 0.12