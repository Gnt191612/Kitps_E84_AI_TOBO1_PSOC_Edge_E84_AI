<!-- ═══ 舵机组 ═══ -->
<rect x="28" y="548" width="624" height="168" rx="8" fill="#FBF9F4" stroke="#8B5E34" stroke-width="1.2"/>
<text x="40" y="570" font-size="13" font-weight="bold" fill="#8B5E34" font-family="sans-serif">舵机组 ×7（全部由 H7 PWM 直控 · 电源一律外部独立，勿从任何开发板/USB 取电）</text>
<text x="40" y="594" font-size="11" fill="#24292F" font-family="sans-serif">雷达水平舵机（SG90 270° 位置）　　PA0　TIM2_CH1　0°/135°/270° = 0.5/1.5/2.5ms（须逐只校准）</text>
<text x="40" y="616" font-size="11" fill="#24292F" font-family="sans-serif">Camera0 云台（ESP32-A）　　　　　Pan=PA1　Tilt=PA2</text>
<text x="40" y="638" font-size="11" fill="#24292F" font-family="sans-serif">Camera1 云台（ESP32-B）　　　　　Pan=PA3　Tilt=PC7</text>
<text x="40" y="660" font-size="11" fill="#24292F" font-family="sans-serif">Camera2 云台（84E+OV7675）　　　 Pan=PB0　Tilt=PB1</text>
<text x="40" y="684" font-size="10" fill="#57606A" font-family="sans-serif">水平 4×SG90 270° 位置 · 俯仰 3×SG90 180° 位置 · 50Hz · PSC=199 · ARR=19999 · 脉宽不能直接视为安全值，须按实物校准</text>
<text x="40" y="704" font-size="10" fill="#8B5E34" font-family="sans-serif">供电：外部独立电源（与 H7 共地）· 型号/额定电流与逐只堵转电流未确认前，禁止七只同时通电测试</text>

<!-- ═══ OV2640 板载走线 ═══ -->
<rect x="28" y="728" width="624" height="128" rx="8" fill="#F6F8FA" stroke="#8250DF" stroke-width="1.2"/>
<text x="40" y="750" font-size="13" font-weight="bold" fill="#8250DF" font-family="sans-serif">ESP32-S3-CAM 板载 OV2640（板厂焊死 · 排线扣上即接好，两台相同）</text>
<text x="40" y="772" font-size="10.5" fill="#24292F" font-family="sans-serif">XCLK=G15 · SIOD=G4 · SIOC=G5 · VSYNC=G6 · HREF=G7 · PCLK=G13 · PWDN/RESET=未接（代码 -1，软件初始化）</text>
<text x="40" y="790" font-size="10.5" fill="#24292F" font-family="sans-serif">D7..D0 = G16 / G17 / G18 / G12 / G10 / G8 / G9 / G11　（G9/G10/G12 属摄像头数据线，禁作他用）</text>
<text x="40" y="810" font-size="10" fill="#57606A" font-family="sans-serif">G14=角色检测跳线（A 接 3.3V，B 接 GND 或悬空，只作输入）· G43/G44=板载 USB 串口 UART0</text>
<text x="40" y="830" font-size="10" fill="#57606A" font-family="sans-serif">代码：ov2640.c s_default_pins（与 WIRING 第 6 节一致）· ESP32 只算控制量回传 H7 执行，不接舵机</text>

<!-- ═══ 已取消连线 ═══ -->
<rect x="28" y="868" width="624" height="76" rx="8" fill="#FFF8F8" stroke="#CF222E" stroke-width="1.2"/>
<text x="40" y="890" font-size="12" font-weight="bold" fill="#CF222E" font-family="sans-serif">已取消的连线（固件不再驱动 · 不要接）</text>
<text x="40" y="910" font-size="10" fill="#6E2C2C" font-family="sans-serif">H7 PB8/PB9/PB12/PB13（旧 84E 事件通知线）· H7 PC1（旧 RST84E，84E 复位脚属 1.8V 域）</text>
<text x="40" y="928" font-size="10" fill="#6E2C2C" font-family="sans-serif">84E P21_2/P21_3（官方 BSP 中为 I2S，不可作 UART）· P21_4~P21_7（雷达 SPI）· ESP32 本地 PWM 舵机（G12/G14 方案已废弃）</text>

<!-- ═══ 帧协议 ═══ -->
<rect x="28" y="956" width="624" height="92" rx="8" fill="#F0F6FC" stroke="#0969DA" stroke-width="1.2"/>
<text x="40" y="978" font-size="12" font-weight="bold" fill="#0969DA" font-family="sans-serif">帧协议（AA 55 + len + type + payload + XOR · 校验覆盖 type..payload · 三路 UART 115200 8N1）</text>
<text x="40" y="998" font-size="10" fill="#24292F" font-family="sans-serif">H7→84E：type 0x01 · 22B（cmd_type, target_id, center_angle/angle_width/min_dist/max_dist f32, timestamp_ms）</text>
<text x="40" y="1016" font-size="10" fill="#24292F" font-family="sans-serif">84E→H7：type 0x02 · 21B（target_id, confidence/x/y/dist/angle f32）· H7 侧 confidence&lt;0.5 视为未识别</text>
<text x="40" y="1034" font-size="10" fill="#24292F" font-family="sans-serif">UPLOAD 0x03（文本上传→WiFi 中继）· BROWSER_CMD 0x04（浏览器指令）· 代码：h7_link.c / protocol.c</text>

<!-- ═══ 供电 ═══ -->
<rect x="28" y="1060" width="624" height="86" rx="8" fill="#FFF5F5" stroke="#CF222E" stroke-width="1.2"/>
<text x="40" y="1082" font-size="13" font-weight="bold" fill="#CF222E" font-family="sans-serif">供电拓扑（全系统共地 · 大电流地星形汇流）</text>
<text x="40" y="1102" font-size="10.5" fill="#24292F" font-family="sans-serif">KIT_PSE84_AI 按官方底板供电 · H7 按第三方底板说明 · ESP32-A/B 按底板输入规格独立供电（不从 H7 取电）</text>
<text x="40" y="1120" font-size="10.5" fill="#24292F" font-family="sans-serif">HC-SR04 5V · 舵机×7 外部独立电源（电源型号/额定电流待确定 · 禁充电宝直供）· 各项电流均待实测</text>
<text x="40" y="1138" font-size="10" fill="#CF222E" font-family="sans-serif">堵转/峰值电流未确认前禁止七只舵机同时通电 · 储能电容+去耦 · 反接保护 · 大电流地不经过 H7 板载地/杜邦线串接</text>

