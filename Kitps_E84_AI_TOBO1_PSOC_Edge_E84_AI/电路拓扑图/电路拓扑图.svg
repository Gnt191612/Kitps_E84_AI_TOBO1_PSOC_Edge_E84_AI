<text x="40" y="158" font-size="11" fill="#24292F" font-family="sans-serif">J5 P9_2  SCB1 UART TX</text>
<text x="40" y="176" font-size="11" fill="#24292F" font-family="sans-serif">J5 P9_3  SCB1 UART RX</text>
